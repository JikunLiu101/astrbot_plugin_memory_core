name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # the library from its repository until memory-core-lib is on PyPI; then: "memory-core-lib>=0.6.0"
      - run: python -m pip install "memory-core-lib @ git+https://github.com/JikunLiu101/memory-core" pytest
      - run: python -m pytest -q
